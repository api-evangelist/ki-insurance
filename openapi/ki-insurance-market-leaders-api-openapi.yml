paths:
  /api/company-markets-config/{classOfBusinessId}:
    get:
      operationId: getCompanyMarketsConfig
      summary: Retrieve company-markets configuration for a class of business
      description: Observed in the Ki broker platform client bundle as `companyMarkets.config` -> `GET /api/company-markets-config/${e}`. Request and response schemas are not published by Ki and are deliberately left unspecified rather than invented.
      tags:
      - Market Leaders
      x-observed-registry-key: companyMarkets.config
      x-observed-method-evidence: explicit GET helper call site
      x-observed-confidence: high
      responses:
        '200':
          description: Successful response. Ki does not publish the response schema.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Maintenance'
      parameters:
      - name: classOfBusinessId
        in: path
        required: true
        schema:
          type: string
  /api/nominated-insurer/cob/{classOfBusinessId}:
    get:
      operationId: getInsurerNominatedInsurerByClassOfBusiness
      summary: List nominated lead insurers for a class of business
      description: Observed in the Ki broker platform client bundle as `insurer.nominatedInsurerByClassOfBusiness` -> `GET /api/nominated-insurer/cob/${e}`. Request and response schemas are not published by Ki and are deliberately left unspecified rather than invented.
      tags:
      - Market Leaders
      x-observed-registry-key: insurer.nominatedInsurerByClassOfBusiness
      x-observed-method-evidence: explicit GET helper call site
      x-observed-confidence: high
      responses:
        '200':
          description: Successful response. Ki does not publish the response schema.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Maintenance'
      parameters:
      - name: classOfBusinessId
        in: path
        required: true
        schema:
          type: string
  /api/nominatedlead:
    get:
      operationId: getSyndicateLloydsLeaders
      summary: List Lloyd's lead syndicates
      description: Observed in the Ki broker platform client bundle as `syndicate.lloydsLeaders` -> `GET /api/nominatedlead`. Request and response schemas are not published by Ki and are deliberately left unspecified rather than invented.
      tags:
      - Market Leaders
      x-observed-registry-key: syndicate.lloydsLeaders
      x-observed-method-evidence: explicit GET helper call site
      x-observed-confidence: high
      responses:
        '200':
          description: Successful response. Ki does not publish the response schema.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

        '503':
          $ref: '#/components/responses/Maintenance'
  /api/nominatedlead/v2/cob/{classOfBusinessId}:
    get:
      operationId: getSyndicateNominatedSyndicateByClassOfBusiness
      summary: List nominated lead syndicates for a class of business
      description: Observed in the Ki broker platform client bundle as `syndicate.nominatedSyndicateByClassOfBusiness` -> `GET /api/nominatedlead/v2/cob/${e}?newBusiness=${t||!1}`. Request and response schemas are not published by Ki and are deliberately left unspecified rather than invented.
      tags:
      - Market Leaders
      x-observed-registry-key: syndicate.nominatedSyndicateByClassOfBusiness
      x-observed-method-evidence: explicit GET helper call site
      x-observed-confidence: high
      responses:
        '200':
          description: Successful response. Ki does not publish the response schema.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Maintenance'
      parameters:
      - name: classOfBusinessId
        in: path
        required: true
        schema:
          type: string
      - name: newBusiness
        in: query
        required: false
        schema:
          type: string
        description: Query parameter observed verbatim in the published client bundle.
components:
  responses:
    Maintenance:
      description: Service unavailable. The client routes the user to the maintenance page.
    Forbidden:
      description: Forbidden. The client routes the user to the forbidden page.
    Unauthorized:
      description: Unauthorized. The client clears the session and returns the user to login.
  securitySchemes:
    auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Auth0-issued access token. The client attaches `Authorization: Bearer <token>` to every call. Issuer `https://login.ki-insurance.com/`, audience `https://api.ki.com`.'
    auth0OpenId:
      type: openIdConnect
      openIdConnectUrl: https://login.ki-insurance.com/.well-known/openid-configuration
      description: Auth0 OIDC discovery for the partner login (authorization code + PKCE).

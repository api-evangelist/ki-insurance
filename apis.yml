apis:
- aid: ki-insurance:broker-platform
  name: Ki Broker Trading Platform API
  description: >-
    The same-origin REST API behind app.ki-insurance.com, the partner-gated broker
    trading platform where Lloyd's brokers place risks with Ki's follow algorithm.
    Ki publishes no reference documentation for it; the surface catalogued here was
    observed verbatim in the endpoint registry Ki's own client ships in its public
    JavaScript bundle — 102 paths and 109 operations covering quote creation and
    versioning, algorithmic pricing runs, schedule-of-values upload and geocoding,
    slip extraction jobs, firm order notes, the broker pipeline and dashboard,
    leads, users, broking houses and branches, nominated lead syndicates and
    insurers, Lloyd's risk codes and a large class-of-business master-data surface.
    Every call carries an Auth0-issued bearer token (issuer
    https://login.ki-insurance.com/, audience https://api.ki.com); there is no
    self-serve access.
  humanURL: https://app.ki-insurance.com/
  baseURL: https://app.ki-insurance.com

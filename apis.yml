aid: ki-insurance
url: https://raw.githubusercontent.com/api-evangelist/ki-insurance/refs/heads/main/apis.yml
name: Ki Insurance
kind: company
description: >-
  Ki is the first fully digital, algorithmically driven syndicate at Lloyd's of
  London, launched in 2020 out of Brit with Google Cloud and University College
  London and capitalised with US$500m from Blackstone Tactical Opportunities and
  Fairfax Financial. Operating from the United Kingdom as Lloyd's Syndicate 1618,
  Ki writes follow-only capacity across specialty lines — property, casualty and
  specialty — quoting risks that a lead underwriter has already priced, in seconds
  rather than days, through an algorithm rather than a face-to-face negotiation in
  the Room. Brokers reach Ki through app.ki-insurance.com, a partner-gated
  single-page platform behind an Auth0 authorization-code login, and Ki announced a
  "Broker API" in May 2021 that lets partner broking platforms request quotes
  directly from the algorithm. That API posture is entirely partner-gated: there is
  no developer portal, no public reference documentation, no self-serve signup, no
  provider-published OpenAPI or Postman collection, and no public webhook or event
  catalog. What is observable is the platform API itself — Ki's own broker client
  ships a complete endpoint registry in its public JavaScript bundle, exposing a
  same-origin REST surface of roughly a hundred JSON operations across quotes,
  quote lines, pricing, schedules of values, slip extraction, leads, pipeline,
  broking houses, nominated leads and Lloyd's risk codes, all authorised with an
  Auth0 bearer token. API Evangelist has derived an observed OpenAPI from that
  bundle. Ki remains the archetype of the United Kingdom's London-market pattern:
  genuinely advanced machine-to-machine insurance placement infrastructure, aimed
  at brokers and syndicates rather than at developers, and therefore effectively
  invisible from the outside.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived

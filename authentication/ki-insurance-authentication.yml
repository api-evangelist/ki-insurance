  api_key_in: []
  oauth2_flows:
  - authorizationCode
  model: >-
    Partner-gated OAuth 2.0 / OpenID Connect. Ki fronts an Auth0 EU tenant at
    login.ki-insurance.com. The broker single-page app performs an
    authorization-code + PKCE login and then attaches the resulting Auth0 access
    token as `Authorization: Bearer <JWT>` to every call against the same-origin
    /api surface on app.ki-insurance.com. There is no API key, no mTLS scheme and
    no self-serve credential issuance published anywhere on Ki's public surface.

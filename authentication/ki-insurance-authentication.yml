  bearerFormat: JWT
  description: >-
    Auth0-issued access token. Observed in the platform client's request helper,
    which sets `Authorization: Bearer <token>`, `Accept: application/json` and
    `Content-Type: application/json` on every request and uses
    `credentials: same-origin`.
  sources:

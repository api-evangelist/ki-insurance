login_flow:
  entry: https://auth.ki-insurance.com/login?return_to=<url>
  note: >-
    Ki runs its own thin login/logout shim at auth.ki-insurance.com in front of
    Auth0. GET /login without return_to responds `Missing 'return_to' query
    parameter.` (HTTP 400); GET /logout (HTTP 302) redirects to
    https://login.ki-insurance.com/v2/logout. The shim is not an OIDC issuer —
    its /.well-known/openid-configuration is 404.
